spring.application.name=final
server.port=5555

spring.datasource.url=jdbc:postgresql://localhost:5432/final
spring.datasource.username=postgres
spring.datasource.password=1234

mybatis.mapper-locations=classpath:sqls/**/*.xml
mybatis.type-aliases-package=com.mbc.puf
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=com.mbc.puf.common.typehandler.PgEnumTypeHandler

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.email-verification.code-ttl-minutes=3
app.email-verification.resend-cooldown-seconds=60
app.email-verification.verified-valid-minutes=30

app.password-reset.code-ttl-minutes=3
app.password-reset.resend-cooldown-seconds=60
app.password-reset.verified-valid-minutes=30

server.error.include-message=always

server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax

# server.servlet.session.cookie.secure=true

puf.internal.api-key=dev-internal-key-change-me
puf.ocr-server.url=http://localhost:8002
puf.ocr-server.timeout-seconds=10

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# 메일 계정(username/password)은 application-secret.properties 에 있어요 (Git에 안 올라감)
spring.config.import=optional:classpath:application-secret.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${spring.mail.username}

puf.weather-stub.enabled=false