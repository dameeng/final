<!doctype html><html lang="ko"><meta charset="utf-8"><body><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue'
import TrafficMapLayers from '../src/components/TrafficMapLayers.vue'
import InternalUnderpassModal from '../src/components/InternalUnderpassModal.vue'
import TunnelReferenceVideo from '../src/components/TunnelReferenceVideo.vue'
const host = document.createElement('div'); host.id = 'map'; host.style.marginTop='200px'; document.body.append(host)
let level = 5
let overlap = false
const listeners = new Map()
const map = { getBounds: () => ({ contain: () => true }), getLevel: () => level, getProjection: () => ({ containerPointFromCoords: position => overlap ? { x:0,y:0 } : { x:position.lng*100000000,y:position.lat*100000000 } }) }
window.setTrafficOverlap = value => { overlap=value; for (const listener of listeners.get('idle') || []) listener() }
window.setTrafficZoom = value => { level=value; for (const listener of listeners.get('zoom_changed') || []) listener() }
const maps = {
  LatLng: class { constructor(lat,lng) { this.lat=lat; this.lng=lng } },
  CustomOverlay: class { constructor(options) { this.content=options.content; host.append(this.content) } setMap(value) { if (!value) this.content.remove() } },
  event: { addListener(target,type,listener) { if (!listeners.has(type)) listeners.set(type,new Set()); listeners.get(type).add(listener) }, removeListener(target,type,listener) { listeners.get(type)?.delete(listener) }, preventMap() {} },
}
createApp({ setup() { const open = ref(false); return () => h('div', [
  location.search.includes('tunnel=1') ? h(TunnelReferenceVideo) : null,
  h(TrafficMapLayers, { map, maps }),
  h('button', { onClick: () => open.value=true }, '내부 지하차도 보기'),
  h(InternalUnderpassModal, { modelValue:open.value, 'onUpdate:modelValue':value => open.value=value, facilityId:61, facilityName:'테스트 지하차도' }),
]) } }).mount('#app')
</script></body></html>
