<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><div id="app"></div><script type="module">
import {createApp,h,ref} from 'vue'
import {createRouter,createMemoryHistory} from 'vue-router'
import FacilityCctvViewer from '../src/components/FacilityCctvViewer.vue'
import '../src/styles/shared.css'
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/:pathMatch(.*)*',component:{render:()=>null}}]})
createApp({setup(){const id=ref('1');window.selectTestFacility=value=>id.value=value;return()=>h(FacilityCctvViewer,{underpassId:id.value,cameras:location.search.includes('road=1')?[{id:230,underpassId:1,cameraRole:'CCTV',streamUrl:'http://sinkhole.test/stream/230'},{id:226,underpassId:1,cameraRole:'APPROACH_LPR',streamUrl:'http://ocr.test/stream/226'}]:[{id:61,cameraRole:'APPROACH_LPR',streamUrl:location.search.includes('ai=1')?'http://ocr.test/stream/61':''}]})}}).use(router).mount('#app')
</script></html>
