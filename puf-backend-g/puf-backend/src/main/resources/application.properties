spring.application.name=final
server.port=5555

spring.datasource.url=jdbc:postgresql://localhost:5432/mydb?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.phone-verification.code-ttl-minutes=3
app.phone-verification.resend-cooldown-seconds=60
app.phone-verification.verified-valid-minutes=30

puf.sms-stub.expose-code=true

app.manager.auto-approve-after-seconds=60

server.error.include-message=always

server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax


puf.internal.api-key=dev-internal-key-change-me
puf.ocr-server.url=http://localhost:8002
puf.ocr-server.timeout-seconds=10

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'

spring.config.import=optional:classpath:application-secret.properties

puf.weather-stub.enabled=false
