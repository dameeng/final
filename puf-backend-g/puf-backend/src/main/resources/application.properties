# ---------------------------------------------------------------
# Main settings. Secret or machine-specific values are NOT written here.
# They live in application-secret.properties (not in Git) and are
# read below with ${secret.xxx}. See application-secret.properties.example.
# ---------------------------------------------------------------

# Load the secret file. If the file is missing, the app stops with a clear message.
spring.config.import=classpath:application-secret.properties

spring.application.name=final
server.port=5555

# ---- Database (values come from the secret file) ----
spring.datasource.url=${secret.db.url}
spring.datasource.username=${secret.db.username}
spring.datasource.password=${secret.db.password}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- File upload ----
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---- Phone verification ----
app.phone-verification.code-ttl-minutes=3
app.phone-verification.resend-cooldown-seconds=60
app.phone-verification.verified-valid-minutes=30
puf.sms-stub.expose-code=true
# false = do not send real text messages (StubSmsSender only writes the text to the server log).
# true  = send real text messages through Solapi (needs the three secret.sms.* values in the secret file).
puf.sms.enabled=false
puf.sms.api-key=${secret.sms.api-key:}
puf.sms.api-secret=${secret.sms.api-secret:}
# Sender number. It must be a number registered and verified in the Solapi console (digits only).
puf.sms.from=${secret.sms.from:}
puf.sms.base-url=https://api.solapi.com
puf.sms.timeout-seconds=10

# ---- Manager signup ----
app.manager.auto-approve-after-seconds=60

# ---- Web server ----
server.error.include-message=always
server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax

# ---- Internal API (FastAPI -> Spring). The key must match the one FastAPI sends. ----
puf.internal.api-key=${secret.internal.api-key}

# ---- OCR server (address differs per machine, so it is in the secret file) ----
puf.ocr-server.url=${secret.ocr-server.url}
puf.ocr-server.timeout-seconds=10

# ---- VMS auto display (its_vms). near-m: at or below this distance = near wording, above = far wording (detour) ----
puf.display.near-m=300
puf.display.release-notice-minutes=10
puf.display.min-level=WATCH
puf.display.sync-seconds=60
# puf.display.default-text: default line(s) for a VMS with nothing to show. Use \n for a line break. Korean default is set in code.

# ---- Weather API (Korea Meteorological Administration). Empty is OK until it is used. ----
puf.kma.service-key=${secret.kma.service-key:}
puf.kma.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
puf.kma.timeout-seconds=10
# Real KMA weather is only for the weather screen. It is kept in server memory (not in the database).
# It does NOT touch the weather tables that FastAPI reads (those stay on the demo stub), and it runs
# whether puf.demo.enabled is true or false. Set collect-enabled=false to stop calling KMA.
puf.kma.collect-enabled=true
# How often to check KMA (minutes). KMA data changes once an hour, so the same data is never requested twice. 10 is enough.
puf.kma.collect-interval-minutes=10
# Wait this many seconds after the server starts before the first collection.
puf.kma.collect-initial-delay-seconds=10

# ---- Shinwol-Yeoui tunnel public CCTV (Seoul Tunnel). The server calls it for the browser. ----
puf.tunnel-cctv.base-url=https://seoultunnel.co.kr/usage
puf.tunnel-cctv.timeout-seconds=10
# Keep the camera list for this many seconds (the provider is not called again before that).
puf.tunnel-cctv.list-cache-seconds=300
# Keep one camera's stream info for this many seconds.
puf.tunnel-cctv.stream-cache-seconds=60

# ---- Kakao Mobility directions API (REST key). Empty is OK until it is used. ----
puf.kakao.rest-key=${secret.kakao.rest-key:}
# Kakao JavaScript key for the map in the navigation PWA (a key limited to your web domains).
puf.kakao.js-key=${secret.kakao.js-key:}

# ---- Demo stubs (fake weather + flood model + water sensor + heavy-rain scenario) ----
# true = run the fake data and open /api/demo/scenarios/**. Use it only for demos. Keep false in production.
puf.demo.enabled=true
# true = the demo also sends fake flood-model scores (now + next 6 hours).
# false = the demo only makes weather and water level; the real flood server (FastAPI 8001) reads that weather and sends the scores.
# Keep false while the flood server is running, or the two sets of scores get mixed.
puf.demo.model-stub-enabled=false
# How often the fake data is refreshed for regions that are NOT in a running scenario (minutes).
# Regions in a running scenario always update every 10 seconds.
puf.demo.calm-score-minutes=5
puf.demo.calm-water-minutes=5
puf.demo.calm-forecast-minutes=10
# Outside a scenario the risk score wanders a little between safe and caution (it never reaches alert, which needs water level).
# calm-max-score = highest score it can reach (caution starts at 70). calm-step = how much it moves each time (0 = almost still).
puf.demo.calm-max-score=75
# How fast the demo water level can follow a rising risk score, in cm per 10 seconds. Smaller = slower rise.
# The heavy-rain scenario curve is not limited by this value.
puf.demo.water-rise-cm-per-step=1.5
puf.demo.calm-step=10

# ---- API docs (Swagger UI) ----
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ---- Live updates (SSE) ----
# Dev only: lets you send a test event with POST /api/internal/stream/test.
# Set this to false in production so the test API does not exist.
puf.stream.test-endpoint=true

# ---- Risk level rules (5 stages: safe / watch / caution / alert / severe) ----
# Water level (cm) at which the underpass is blocked automatically ("alert" stage).
# Normal underpass: 15 cm. Underpass with flood history or marked "early block": 5 cm.
puf.risk.water.default-block-cm=15
puf.risk.water.early-block-cm=5
# "Severe" stage starts this many cm above the block level.
puf.risk.water.severe-extra-cm=15
# Anti-flapping: the stage goes UP right away, but goes DOWN only after the value
# is lower than the line by this margin. Score margin is in points, water margin in cm.
puf.risk.hysteresis.score=3
puf.risk.hysteresis.water-cm=1

# ---- Navigation (detour around flooded underpasses) ----
# Hazard = underpass at "watch" level or higher, or blocked. Blocked ones must be avoided, the others are only advised.
# A route is "near" an underpass when it passes within this many meters of the underpass center point.
puf.navigation.default-radius-m=70
# Underpasses whose entry/exit camera positions are really surveyed (list of underpass ids, comma separated).
# Only these use the entry->exit line and the smaller radius below. Do not list underpasses with dummy camera positions.
puf.navigation.surveyed-underpass-ids=
puf.navigation.surveyed-radius-m=40
# Per underpass radius override, "underpassId:meters,underpassId:meters" (example: 3:120,5:90)
puf.navigation.radius-overrides=
# How many waypoint candidates to try when looking for a detour (each try calls the Kakao API once).
puf.navigation.max-detour-tries=10
# Kakao guide type that means "entering an underpass" (15). A guide of this type within the radius of a hazard counts as passing it.
puf.navigation.underpass-guide-type=15
puf.navigation.underpass-guide-radius-m=150
# Max calls per minute from one IP to the public navigation search APIs (places, directions).
puf.navigation.search-limit-per-minute=60
# Manual waypoints used only when all candidates fail, "lng,lat|lng,lat"
puf.navigation.fallback-waypoints=

# ---- Push notifications (FCM) ----
# false = do not call FCM, only write the push to the server log (default, works without keys).
# true  = send real push through Firebase Cloud Messaging (needs the service account JSON file below).
puf.fcm.enabled=false
# Path of the Firebase service account JSON file (Firebase console > Project settings > Service accounts).
puf.fcm.credentials-path=${secret.fcm.credentials-path:}
# Address opened when a web push is tapped (must start with https:// to be used).
puf.fcm.click-url=
# Android notification channel id created in the app (sound and vibration are tied to the channel). Empty = use the app default.
puf.fcm.android-channel-id=

# ---- Urgent popup ----
# Urgent notifications that a manager has not read yet are listed for this many minutes (GET /api/managers/me/notifications/urgent).
puf.urgent.window-minutes=120

# ---- Alerts ----
# Do not send the same kind of alert to the same car at the same underpass again within this many seconds (0 = no limit).
puf.alert.cooldown-seconds=120

# ---- Predictive maintenance (pm) ----
# --- No data (sensor stopped sending) ---
# Equipment counts as "no data" when its last sensor time is older than: max(sensor interval x multiplier, min-seconds).
# Default result: pump 1 min / water level 15 min / CCTV and display 3 hours. Reports use the same rule.
puf.pm.stale.multiplier=3
puf.pm.stale.min-seconds=60
# Check for no-data equipment and create a "no data" event. Turn OFF when no sensor data keeps coming in
# (for example after a one-time backfill and before the sensor stub is attached), or every equipment will be reported.
puf.pm.stale.enabled=false
puf.pm.stale.check-seconds=30
puf.pm.stale.initial-delay-seconds=60
# --- Events from scores ---
# "Surge" event: score is at least caution level AND rose this many points above the lowest score of the last N hours.
puf.pm.surge-delta=25
puf.pm.surge-window-hours=24
# --- Engine status (how long since the prediction server last sent scores) ---
puf.pm.engine.delayed-seconds=180
puf.pm.engine.down-seconds=600
# --- Sensor backfill (demo data) ---
# true = at server start, fill past sensor data for equipment that has none yet (safe to leave on, equipment with data is skipped).
# POST /api/internal/pm/sensor-backfill does the same by hand (reset=true wipes and rebuilds).
puf.pm.backfill.on-startup=true
# Total weeks of data, and how many of the first weeks are normal only (anomalies start after that).
puf.pm.backfill.weeks=14
puf.pm.backfill.normal-weeks=4
# Pump data is every 10 seconds (about 60,000 rows per pump per week). 0 = same as weeks, or set fewer weeks for pumps to save space.
puf.pm.backfill.pump-weeks=0
# Create the daily report bell notification for each region every day (Asia/Seoul time).
puf.pm.daily-report-enabled=true
puf.pm.daily-report-cron=0 0 8 * * *

# ---- Local PM sensor stub (raw sensor rows; scores are calculated by pm_server) ----
# Disable when real sensors are connected. Existing historical backfill remains enabled.
puf.pm.sensor-stub.enabled=true
puf.pm.sensor-stub.tick-ms=5000
puf.pm.sensor-stub.max-catch-up-samples=360

# --- Risk score history backfill (demo data) ---
# true = at server start, fill past risk scores for the graph (safe to leave on, underpasses with enough history are skipped).
puf.risk.history-backfill.on-startup=true
# How many past hours to fill, and the gap between points in minutes.
puf.risk.history-backfill.hours=6
puf.risk.history-backfill.step-minutes=10
# Base score used when the current score is still 0 (a fresh database).
puf.risk.history-backfill.calm-score=10

# YOLO sinkhole photo ingestion (camera/equipment ownership is validated by Spring)
puf.sinkhole.underpass-name=${SINKHOLE_UNDERPASS_NAME:\ucd08\ub7c9\uc9c0\ud558\ucc28\ub3c4}
puf.sinkhole.image-dir=${SINKHOLE_IMAGE_DIR:./sinkhole-images}

# Camera230 uses the sinkhole server; camera226-229 retain the OCR server.
puf.sinkhole.server-url=${SINKHOLE_SERVER_URL:http://localhost:8003}
puf.sinkhole.camera-id=230
puf.sinkhole.timeout-seconds=10

# Review below the same camera's recent 100-result mean; false restores the fixed 0.600 rule.
puf.ocr.review-relative-to-average=${OCR_REVIEW_RELATIVE_TO_AVERAGE:true}
